<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>박시은의 매일매일 공부방</title>
<meta name="application-name" content="시은이 공부방">
<meta name="apple-mobile-web-app-title" content="시은이 공부방">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffb6c8">
<meta name="description" content="7살 시은이가 혼자 푸는 매일 10문제 공부방">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 홈 -->
  <section id="home" class="screen active">
    <header class="home-head">
      <h1>박시은의<br><span>매일매일 공부방</span></h1>
      <div class="today-bar">
        <div class="pill">오늘 <b id="todayCount">0</b>문제</div>
        <div class="pill star">⭐ <b id="starCount">0</b></div>
      </div>
    </header>
    <div id="tiles" class="tiles"></div>
    <footer class="home-foot">
      <button class="link" id="openCredits">사진·소리 출처</button>
      <button class="link" id="openParents">부모님 메뉴</button>
    </footer>
  </section>

  <!-- 문제 -->
  <section id="quiz" class="screen">
    <div class="quiz-top">
      <button class="icon-btn" id="quizHome" aria-label="홈으로">🏠</button>
      <div class="progress"><div class="progress-fill" id="progressFill"></div><span id="progressText">1 / 10</span></div>
      <div class="pill star small">⭐ <b id="quizStars">0</b></div>
    </div>
    <div class="card" id="card">
      <div class="prompt-row">
        <p class="prompt" id="prompt"></p>
        <button class="icon-btn speak" id="speakBtn" aria-label="다시 듣기">🔊</button>
      </div>
      <div class="media" id="media"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <button class="next-btn hidden" id="nextBtn">다음 ▶</button>
  </section>

  <!-- 끝 -->
  <section id="done" class="screen">
    <div class="done-box">
      <div class="confetti" id="confetti"></div>
      <div class="big-emoji">🏆</div>
      <h2 id="doneTitle">오늘도 시은이가 해냈어요! ⭐</h2>
      <p id="doneText"></p>
      <div class="done-stars" id="doneStars"></div>
      <button class="big-btn" id="doneHome">🏠 다른 공부 하러 가기</button>
      <button class="big-btn soft" id="doneMore">✏️ 10문제 더 풀기</button>
    </div>
  </section>

  <!-- 출처 -->
  <section id="credits" class="screen">
    <div class="sub-head"><button class="icon-btn" data-home>🏠</button><h2>사진·소리 출처</h2></div>
    <div class="credits-body" id="creditsBody">불러오는 중…</div>
  </section>

  <!-- 오답노트 -->
  <section id="notes" class="screen">
    <div class="sub-head"><button class="icon-btn" data-home>🏠</button><h2>📒 오답노트</h2></div>
    <div class="notes-body" id="notesBody"></div>
  </section>

  <!-- 부모님 메뉴 -->
  <section id="parents" class="screen">
    <div class="sub-head"><button class="icon-btn" data-home>🏠</button><h2>부모님 메뉴</h2></div>
    <div class="parents-body" id="parentsBody"></div>
  </section>

  <!-- 그림 그리기 -->
  <section id="draw" class="screen">
    <div class="sub-head"><button class="icon-btn" data-home>🏠</button><h2>그림 그리기</h2></div>
    <canvas id="canvas"></canvas>
    <div class="draw-tools">
      <div class="palette" id="palette"></div>
      <div class="tool-grid">
        <button class="tool active" data-mode="pen">연필</button>
        <button class="tool" data-mode="fill">페인트통</button>
        <button class="tool" data-mode="eraser">지우개</button>
        <button class="tool" data-size="4">가늘게</button>
        <button class="tool active" data-size="10">보통</button>
        <button class="tool" data-size="22">굵게</button>
        <button class="tool" id="undo">되돌리기</button>
        <button class="tool" id="clear">모두 지우기</button>
        <button class="tool" id="save">저장</button>
      </div>
    </div>
  </section>
</div>
<div id="starFly" class="star-fly">⭐</div>
<script src="js/gen.js"></script>
<script src="js/app.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/sync.js"></script>
<script src="js/draw.js"></script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
</body>
</html>
